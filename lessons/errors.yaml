- id: ERR-2026-06-15-003
  date: '2026-06-15'
  category: timeout-desync
  title: Subagent-Coordinator Desync due to Missing Execution Timeouts
  description: |
    Subagents were running up to 87 minutes, bypassing the coordinator's 1-hour stale threshold.
    This caused the coordinator to spawn parallel subagents, wasting resources and creating race conditions.
  root_cause: |
    Subagents were bounded by a 15-iteration limit, which could easily exceed 1 hour under high LLM latency
    or slow target hardware. There were no execution limits at the bridge or systemd level.
  impact: |
    Resource exhaustion, API token leaks, and race conditions where multiple subagents were working in the same repo.
  fix_applied: |
    1. Implemented a 50-minute (3000s) timeout using asyncio.wait_for in eeepc_self_evolving_subagent_bridge.py.
    2. Deployed systemd drop-in with RuntimeMaxSec=3300 (55 minutes) on the host.
  prevention: |
    Always match execution limits across components: the runner timeout (50m) must be strictly less than the orchestrator stale threshold (1h).

- id: ERR-2026-06-15-004
  date: '2026-06-15'
  category: workspace-permissions
  title: Direct SCP Permission Denied on opencode-owned subagent repository files
  description: |
    Attempting to copy code files directly from the subagent research workspace /home/opencode/servers_team/repo_research/ via scp failed with Permission Denied or No such file or directory.
  root_cause: |
    The files inside the subagent repository are owned by the system user 'opencode' and group-writeable, but the ssh session runs under user 'ozand', which does not have read permissions to parts of the home directory structure of 'opencode'.
  impact: |
    Unable to directly pull down agent improvements or logs from the host workspace, slowing down verification and porting of fixes.
  fix_applied: |
    Used ssh command substitution with sudo to read files:
    ssh eeepc "sudo -u opencode cat /path/to/file" > local_file
  prevention: |
    Always access research repository files on the host using 'sudo -u opencode' commands instead of direct scp under normal user accounts.

- id: ERR-2026-06-20-001
  date: '2026-06-20'
  category: workspace-permissions
  title: Systemd services failed with 226/NAMESPACE after opencode user deletion
  description: |
    Upon system migration to a new SSD, the temporary user 'opencode' was deleted by the operator, which instantly broke the systemd services for both the coordinator health checker and the subagent bridge, causing 'No such file or directory' and namespace mount errors.
  root_cause: |
    Multiple systemd unit files, drop-in overrides, and instance configuration files (.env) contained hardcoded paths referencing /home/opencode/ (for repositories, PYTHONPATH, virtual environments, and target workspaces). Once the user was deleted, systemd namespace mount options (like ReadWritePaths=) failed to mount the missing directory structure, preventing service execution.
  impact: |
    Autonomous cycle loop and subagent bridge stopped completely, throwing status=226/NAMESPACE or status=203/EXEC.
  fix_applied: |
    1. Recreated a global virtual environment in /opt/eeepc-agent/venv owned by eeepc-agent.
    2. Cloned the subagent write-target repo (eeebot-self-evolving) to /var/lib/eeepc-agent/self-evolving-agent/eeebot-self-evolving.
    3. Re-directed git origin to use GitHub personal access token (PAT) inside the git remote URL to preserve push access without ssh keys in /home/opencode/.
    4. Rewrote all systemd service units, drop-in overrides (override.conf, zz-working-venv.conf, 90-runtime-pinned-pythonpath.conf, etc.), and instance configs (.env) to reference the new paths under /opt/eeepc-agent and /var/lib/eeepc-agent, and ran systemctl daemon-reload.
  prevention: |
    1. Avoid using personal developer home directories (such as /home/opencode) for daemon workspaces, virtual environments, or scripts.
    2. Maintain all runtime resources (venvs, workspaces, logs) inside dedicated application directories (like /opt/eeepc-agent or /var/lib/eeepc-agent) owned by the application service account.

- id: ERR-2026-06-20-002
  date: '2026-06-20'
  category: deployment
  title: Outdated Subagent Bridge Script Overwritten During Deployment
  description: |
    The subagent bridge was running with a strict instructions payload containing "Do NOT mutate files", even though the subagent is designed to implement code fixes directly.
  root_cause: |
    The file host/eeepc/libexec/eeepc-self-evolving-subagent-bridge.py in the repository was an outdated copy that hardcoded mutation prevention. During every run of deploy_release.sh, this outdated file was copied to /usr/local/libexec/eeepc-self-evolving-subagent-bridge.py, overwriting the dynamic canonical version and blocking active code writing.
  impact: |
    Subagents were restricted to reading and reviewing only, halting the code mutation loop and causing stagnation.
  fix_applied: |
    1. Replaced the outdated libexec script in the repository with the canonical version from scripts/eeepc_self_evolving_subagent_bridge.py.
    2. Redeployed the release, restarted the subagent bridge, and confirmed the subagent successfully modified coordinator.py.
  prevention: |
    Never keep outdated or static script templates in deployment directories. Sync libexec wrappers with the verified canonical script versions.

- id: ERR-2026-06-28-001
  date: '2026-06-28'
  category: deployment
  title: Merged stop-guards never reached the host (stale release + dangling pinned runtime + missing SOURCE_COMMIT)
  description: |
    The self-evolving loop reported PASS every cycle yet made zero real progress: frozen on goal-bootstrap, metric_current==metric_frontier==1.2, reward from materialized_improvement_artifact, decision stuck at not_ready_for_policy_review. The cycle stop-guards (R11/R12/R13, merged #557/#561) that should detect this stall were absent from the running reports (no stop_reason field).
  root_cause: |
    Three stacked breakages: (1) the host runs deployed release tarballs not a git checkout, and the active release (20260624T031434Z-canonical-e7010e5) predated the stop-guards — merging to main changed nothing on the host; (2) the subagent bridge runs with PYTHONPATH=/var/lib/eeepc-agent/.nanobot-eeepc/runtime/pinned/current, a second runtime path deploy_release.sh never updated, whose symlink dangled so the bridge could not import nanobot.runtime; (3) the active release root had no SOURCE_COMMIT, so the promotion engine parked candidates at blocked_not_ready (same as ERR-2026-06-14-001).
  impact: |
    The host looked healthy (green cycles, no errors, timers ticking) while the entire self-improvement mechanism was inert: no stall detection, no lane switching, no promotion, bridge could not load the runtime. Weeks of merged R11/R12/R13 work had no effect in production.
  fix_applied: |
    1. Merged model fix #562, deployed main (a4a5baa) via deploy_release.sh — refreshed /opt/.../current, wrote SOURCE_COMMIT=a4a5baa, re-seeded goal_text.json, synced libexec bridge.
    2. Repaired bridge runtime path: ln -sfn /opt/.../current /var/lib/eeepc-agent/.nanobot-eeepc/runtime/pinned/current; confirmed with a stop_guards import smoke test under the bridge's PYTHONPATH.
    3. Verified live: fresh cycles emit stop_reason=no_progress, stall.stop=true, lane_iteration, and the next cycle shows task_selection_source=switch_stalled_lane — the loop left the stalled bootstrap lane on its own.
  prevention: |
    1. deploy_release.sh now repoints pinned/current at the freshly deployed release in the same run as the current symlink, so the bridge and the loop never drift onto different code.
    2. After any merge that must change runtime behaviour, DEPLOY — green main and green CI do not imply the host runs that code; confirm the active release SOURCE_COMMIT matches the intended commit.
    3. When the loop is "green but not progressing", check the deployed commit and the stop_reason field first: its absence means the running code predates the stop-guards.



