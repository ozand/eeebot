    test suites time out
  hypothesis: Codifying the targeted-test fallback in lessons.yaml lets agents validate
    scoped changes via targeted pytest and script --test flags when full suites time
    out.
  result: 'Reflected: approach hint applied from cycle analysis.'
  generalized_insight: When repo-wide test suites time out on the constrained host,
