- schema_version: 2
  id: LESS-20260905-9fff55dc
  title: Re-evaluate composite preflight gate detection status after executing auto-refresh
    actions so the gate reflects the post-refresh state rather than the pre-refresh
    snapshot
  problem: In reflection-45a8d4511e3e, a composite preflight gate that detects stale
    feed cache files and optionally auto-refreshes them returned its verdict from
    the pre-refresh detection pass. When the refresh action succeeded, the gate still
    reported the feeds as stale (and the cycle as blocked) because it never re-ran
    the detection step after the refresh, so a successful refresh was invisible to
    the gate and the cycle was needlessly blocked on a condition that no longer held.
  solution: 'When a composite preflight gate both detects a condition and executes
    a corrective action (e.g. refresh_stale_feeds), re-run the detection step after
    the action completes and base the gate ok/stale verdict on that post-refresh re-evaluation,
    not the original snapshot. This is exactly what scripts/check_stale_feeds.py preflight_feed_cache
    does: it calls check_stale_feeds, runs refresh_stale_feeds when refresh=True and
    feeds are stale, then calls check_stale_feeds a second time and returns the re-checked
    stale list and ok flag. A gate that mutates state must always re-detect before
    reporting.'
  tags:
  - preflight
  - gate
  - post-refresh
  - re-evaluation
  - feed-cache
  - reflector
  severity: medium
  seen_count: 1
