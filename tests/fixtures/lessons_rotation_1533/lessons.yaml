- schema_version: 2
  id: LESS-20260905-4a577d44
  title: Use composite tool execution — chained shell queries and parallel independent
    tool calls — during context discovery to gather multiple facts in one pass
  problem: 'In cycle-c2ab8feea257, context discovery was performed with a sequence
    of single-purpose tool calls: one exec for a git query, a separate read_file for
    the target, another exec for a test run. Each dependent round-trip consumed a
    full iteration of the bounded cycle budget, and the discovery phase alone burned
    a large share of the 80-iteration limit before any edit was made.'
  solution: 'During the discovery phase, batch independent lookups into composite
    tool executions: chain related shell queries in a single exec call (e.g. `git
    log --oneline -5 -- <path> && git status --porcelain && grep -n <term> <file>`),
    and issue independent read_file/list_dir calls in parallel within the same turn
    rather than one per turn. Reserve sequential calls only for results that genuinely
    depend on a previous call''s output. This collapses N discovery round-trips into
    1-2 and preserves budget for the edit and verification phases.'
  tags:
  - tool-execution
  - discovery
  - efficiency
  - turn-budget
  - reflector
  severity: medium
  seen_count: 1
  first_seen: '2026-09-05'
  last_seen: '2026-09-05'
  evidence:
  - cycle-c2ab8feea257
  date: '2026-09-05'
  cycle_id: cycle-c2ab8feea257
  task_id: Add lesson card for composite tool execution and chained discovery in lessons/lessons.yaml
  hypothesis: Codifying the composite-tool-execution rule in lessons.yaml lets subagents
    collapse multiple independent discovery round-trips into chained shell queries
