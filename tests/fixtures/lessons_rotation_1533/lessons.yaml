- schema_version: 2
  id: LESS-20260905-6d238e44
  title: Chain the script's own CLI self-test (--test) with the paired pytest suite
    in a single bounded verification pass before committing
  problem: In cycle-6d238e44ec05, verification ran the paired pytest suite but skipped
    the script's own --test self-test, so the CLI entrypoint path (argparse wiring,
    exit codes, stderr/JSON separation) went unverified and the cycle had to re-run
    a second pass to confirm the self-test still passed.
  solution: When a changed script exposes a --test self-test flag, run it first (python3
    scripts/<name>.py --test) and immediately chain the paired pytest suite (python3
    -m pytest tests/test_<name>.py) in the same bounded exec call, so both the internal
    self-test and the external suite are verified in one pass before committing.
