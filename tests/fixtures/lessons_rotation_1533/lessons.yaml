- schema_version: 2
  id: LESS-20260904-260bd269
  title: Use sys.stdlib_module_names (Python 3.10+) for O(1) standard library module
    detection instead of dynamic import inspection
  problem: In cycle-bdea8c5fbdc2, detecting whether a module is part of the standard
    library required dynamic inspection (importing modules or walking sys.path), which
    burned tool iterations and exhausted the cycle's turn budget before the change
    was committed.
  solution: 'Check membership against sys.stdlib_module_names, a frozenset of all
    standard library module names available since Python 3.10: `import sys; is_stdlib
    = name in sys.stdlib_module_names`. For submodules (e.g. ''json.decoder''), check
    the top-level package name. Combine with importlib.util.find_spec only when you
    also need to confirm the module is importable in the current environment. This
    is a constant-time set lookup with no import side effects and no filesystem traversal.'
  tags:
  - python
  - stdlib
  - performance
  - detection
  severity: medium
  seen_count: 1
  first_seen: '2026-09-04'
  last_seen: '2026-09-04'
  evidence:
  - cycle-bdea8c5fbdc2
  date: '2026-09-04'
  cycle_id: cycle-260bd269e5a0
  task_id: Record lesson in lessons.yaml on using sys.stdlib_module_names for standard
    library detection
  hypothesis: Codifying the sys.stdlib_module_names lookup in lessons.yaml lets future
    cycles detect standard library modules with a constant-time set membership check
    instead of dynamic import inspection, avoiding turn-budget exhaustion.
  result: 'Reflected: lesson recorded from cycle-bdea8c5fbdc2 turn exhaustion analysis.'
  generalized_insight: Prefer constant-time membership checks against sys.stdlib_module_names
    over dynamic import or sys.path inspection when classifying modules as standard
    library vs third-party; reserve importlib.util.find_spec for cases that also require
    importability confirmation.
- schema_version: 2
  id: LESS-20260904-d44ed220
  title: Stop repeated codebase searches when grep returns empty for newly requested
    feature terms; proceed directly to inspecting and editing the target script
  problem: When a task requests a new feature or term that does not yet exist in the
    codebase, subagents repeatedly re-run grep and list_dir sweeps searching for the
    term, burning tool iterations on searches that will always return empty. The term
    is new by definition, so no existing match is possible, and each redundant search
    wastes a full iteration of the cycle budget.
  solution: When a task names a new feature, term, or symbol that is not yet present
    in the codebase, run at most one targeted grep to confirm absence, then stop searching
    and proceed directly to reading the designated target file and making the edit.
    Do not re-run the same or similar searches expecting a different result. If the
    first grep returns empty, treat that as confirmation the feature is new and move
    to the edit phase immediately.
  tags:
  - search
  - grep
  - efficiency
  - turn-budget
  - new-features
  severity: medium
  seen_count: 1
  first_seen: '2026-09-04'
  last_seen: '2026-09-04'
  evidence:
  - cycle-d44ed220091b
  date: '2026-09-04'
  cycle_id: cycle-d44ed220091b
  task_id: Record lesson in lessons.yaml on avoiding repetitive searches for new feature
    terms
  hypothesis: Codifying the bounded-search guideline in lessons.yaml lets subagents
    skip redundant grep sweeps for new feature terms and proceed directly to target
    inspection and editing, preserving turn budget for actual implementation work.
  result: 'Reflected: lesson recorded from cycle analysis of repetitive search patterns.'
  generalized_insight: When a task introduces a new feature term or symbol, at most
    one targeted grep confirms absence; further identical or similar searches are
    wasted iterations. After confirming the term is new, proceed directly to reading
    the designated target file and making the edit rather than re-searching the codebase.
- schema_version: 2
  id: LESS-20260904-90931e43
  title: Support both repository-relative ('memory/facts/...') and directory-relative
    ('facts/...') markdown link formats in catalog index consistency tests
  problem: In cycle-90931e43a3db, a markdown catalog index consistency test resolved
    every relative link in the index against a single base (the memory/ directory),
    so links written in the other common format — repository-relative ('memory/facts/...')
    instead of directory-relative ('facts/...') — were reported as missing files even
    though the target exists on disk. The test failed on a valid index purely because
    of the link's path format.
  solution: When validating relative markdown links in a catalog index (e.g. memory/index.md),
    resolve each link against both candidate bases — the index file's own directory
    and the repository root — and treat the link as valid if either resolution yields
    an existing file. Only report a link as missing when neither candidate path exists.
    This makes the consistency check format-agnostic for the two relative path conventions
    used in the catalog.
  tags:
  - markdown
  - catalog
  - index
  - link-integrity
  - relative-paths
  - testing
  severity: medium
  seen_count: 1
  first_seen: '2026-09-04'
  last_seen: '2026-09-04'
  evidence:
  - cycle-90931e43a3db
  date: '2026-09-04'
  cycle_id: cycle-90931e43a3db
  task_id: Record lesson on supporting dual relative path formats in markdown catalog
    index consistency tests
  hypothesis: Codifying the dual-base link resolution rule in lessons.yaml lets future
    catalog index consistency tests accept both repository-relative and directory-relative
    markdown links without false-positive missing-file failures.
  result: 'Reflected: lesson recorded from cycle-90931e43a3db reflection on dual relative
    path formats.'
  generalized_insight: Markdown catalog index consistency tests should resolve each
    relative link against both the index file's directory and the repository root,
    and only flag a link as missing when neither candidate path exists, so both 'memory/facts/...'
    and 'facts/...' link formats validate cleanly.
