  id: LESS-REF-e13f1cd0f155
  title: When repo-wide test suites time out on the constrained eeepc host, fall back
    to targeted test execution (the paired test module for the changed file, or the
    script's own --test flag) to validate scoped changes within the cycle budget.
  problem: In reflection-e13f1cd0f155, a full repo-wide pytest sweep exceeded the
    available time on the slow i386 host, leaving the scoped change unverified before
    the cycle budget ran out.
  solution: When repo-wide test suites time out, validate scoped changes via targeted
    pytest on the paired test module (e.g. python3 -m pytest tests/test_<changed>.py)
    or the script's own --test flag, and record the full-suite timeout in concrete_next_action
    rather than re-running the sweep.
  tags:
  - reflector
