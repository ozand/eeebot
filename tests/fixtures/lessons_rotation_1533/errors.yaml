- id: ERR-2026-06-15-003
  date: '2026-06-15'
  category: timeout-desync
  title: Subagent-Coordinator Desync due to Missing Execution Timeouts
  description: 'Subagents were running up to 87 minutes, bypassing the coordinator''s
    1-hour stale threshold.

    This caused the coordinator to spawn parallel subagents, wasting resources and
    creating race conditions.

    '
  root_cause: 'Subagents were bounded by a 15-iteration limit, which could easily
    exceed 1 hour under high LLM latency

    or slow target hardware. There were no execution limits at the bridge or systemd
    level.

    '
  impact: 'Resource exhaustion, API token leaks, and race conditions where multiple
    subagents were working in the same repo.

    '
  fix_applied: '1. Implemented a 50-minute (3000s) timeout using asyncio.wait_for
    in eeepc_self_evolving_subagent_bridge.py.

    2. Deployed systemd drop-in with RuntimeMaxSec=3300 (55 minutes) on the host.

    '
  prevention: 'Always match execution limits across components: the runner timeout
    (50m) must be strictly less than the orchestrator stale threshold (1h).

    '
- id: ERR-2026-06-15-004
  date: '2026-06-15'
  category: workspace-permissions
  title: Direct SCP Permission Denied on opencode-owned subagent repository files
  description: 'Attempting to copy code files directly from the subagent research
    workspace /home/opencode/servers_team/repo_research/ via scp failed with Permission
    Denied or No such file or directory.

    '
  root_cause: 'The files inside the subagent repository are owned by the system user
    ''opencode'' and group-writeable, but the ssh session runs under user ''ozand'',
    which does not have read permissions to parts of the home directory structure
    of ''opencode''.

    '
  impact: 'Unable to directly pull down agent improvements or logs from the host workspace,
    slowing down verification and porting of fixes.

    '
  fix_applied: 'Used ssh command substitution with sudo to read files:

    ssh eeepc "sudo -u opencode cat /path/to/file" > local_file

    '
  prevention: 'Always access research repository files on the host using ''sudo -u
    opencode'' commands instead of direct scp under normal user accounts.

    '
- id: ERR-2026-06-20-001
  date: '2026-06-20'
  category: workspace-permissions
  title: Systemd services failed with 226/NAMESPACE after opencode user deletion
  description: 'Upon system migration to a new SSD, the temporary user ''opencode''
    was deleted by the operator, which instantly broke the systemd services for both
    the coordinator health checker and the subagent bridge, causing ''No such file
    or directory'' and namespace mount errors.

    '
  root_cause: 'Multiple systemd unit files, drop-in overrides, and instance configuration
    files (.env) contained hardcoded paths referencing /home/opencode/ (for repositories,
    PYTHONPATH, virtual environments, and target workspaces). Once the user was deleted,
    systemd namespace mount options (like ReadWritePaths=) failed to mount the missing
    directory structure, preventing service execution.

    '
  impact: 'Autonomous cycle loop and subagent bridge stopped completely, throwing
    status=226/NAMESPACE or status=203/EXEC.

    '
  fix_applied: '1. Recreated a global virtual environment in /opt/eeepc-agent/venv
    owned by eeepc-agent.

    2. Cloned the subagent write-target repo (eeebot-self-evolving) to /var/lib/eeepc-agent/self-evolving-agent/eeebot-self-evolving.

    3. Re-directed git origin to use GitHub personal access token (PAT) inside the
    git remote URL to preserve push access without ssh keys in /home/opencode/.

    4. Rewrote all systemd service units, drop-in overrides (override.conf, zz-working-venv.conf,
    90-runtime-pinned-pythonpath.conf, etc.), and instance configs (.env) to reference
    the new paths under /opt/eeepc-agent and /var/lib/eeepc-agent, and ran systemctl
    daemon-reload.

    '
  prevention: '1. Avoid using personal developer home directories (such as /home/opencode)
    for daemon workspaces, virtual environments, or scripts.

    2. Maintain all runtime resources (venvs, workspaces, logs) inside dedicated application
    directories (like /opt/eeepc-agent or /var/lib/eeepc-agent) owned by the application
    service account.

    '
- id: ERR-2026-06-20-002
  date: '2026-06-20'
  category: deployment
  title: Outdated Subagent Bridge Script Overwritten During Deployment
  description: 'The subagent bridge was running with a strict instructions payload
    containing "Do NOT mutate files", even though the subagent is designed to implement
    code fixes directly.

    '
  root_cause: 'The file host/eeepc/libexec/eeepc-self-evolving-subagent-bridge.py
    in the repository was an outdated copy that hardcoded mutation prevention. During
    every run of deploy_release.sh, this outdated file was copied to /usr/local/libexec/eeepc-self-evolving-subagent-bridge.py,
    overwriting the dynamic canonical version and blocking active code writing.

    '
  impact: 'Subagents were restricted to reading and reviewing only, halting the code
    mutation loop and causing stagnation.

    '
  fix_applied: '1. Replaced the outdated libexec script in the repository with the
    canonical version from scripts/eeepc_self_evolving_subagent_bridge.py.

    2. Redeployed the release, restarted the subagent bridge, and confirmed the subagent
    successfully modified coordinator.py.

    '
  prevention: 'Never keep outdated or static script templates in deployment directories.
    Sync libexec wrappers with the verified canonical script versions.

    '
- id: ERR-2026-09-05-001
  date: '2026-09-05'
  category: test-execution
  title: python3 -m unittest collects 0 tests on suites using standalone functions
    without unittest.TestCase
  description: In cycle-c2ab8feea257, running python3 -m unittest tests.test_agents_structure
    collected 0 tests. The suite uses standalone test functions with plain assert
    statements rather than unittest.TestCase classes, so unittest's discovery mechanism
    found nothing to run. A subsequent pytest invocation was required to actually
    execute the suite.
  root_cause: unittest discovery only collects test methods inside unittest.TestCase
    subclasses. Test suites written as standalone functions with plain assert statements
    (the pytest convention) are invisible to python3 -m unittest, which silently reports
    0 tests collected and exits 0, masking the fact that no tests actually ran.
  impact: The verification step appeared to pass (exit code 0) but executed zero tests,
    giving false confidence that the change was validated. The cycle had to spend
    an additional tool iteration re-running the suite under pytest to get real results.
  fix_applied: Re-ran the suite with python3 -m pytest tests/test_agents_structure.py,
    which correctly discovered and executed all standalone test functions. The suite
    passed under pytest.
  prevention: 'Before choosing a test runner, inspect the test file: if it defines
    standalone test_* functions with plain assert statements (no unittest.TestCase),
    run pytest directly (python3 -m pytest <path>). Reserve python3 -m unittest for
    suites that explicitly subclass unittest.TestCase. When in doubt, prefer pytest
    — it handles both conventions. See also [Lesson LESS-REF-c2ab8feea257-4dc0] in
    lessons/lessons.yaml.'
- id: ERR-2026-09-06-001
  date: '2026-09-06'
  category: loop-breaker
  title: Loop breaker warnings ignored — subagent re-ran the same failing test command
    repeatedly
  description: A subagent hit a loop breaker safety alert after issuing the same test
    command (python3 -m pytest tests/test_agents_structure.py) multiple times in a
    row with identical, unchanged output. Instead of stopping, the agent kept re-running
    the identical command, burning tool iterations and never changing the outcome.
    The loop breaker warning fired but was treated as noise rather than a signal.
  root_cause: The agent treated a repeated, identical command as a transient hiccup
    and retried it verbatim. Re-running a deterministic command with no change to
    its inputs cannot produce a different result, so the repetition was pure waste.
    The loop breaker warning is the harness's explicit signal that the current approach
    is stuck; ignoring it means the agent is not re-evaluating its test logic or its
    assumptions about why the test fails.
  impact: Tool iterations were wasted on no-op repetitions, the cycle risked hitting
    its iteration budget without progress, and the underlying test failure was never
    diagnosed because the agent never changed its approach.
  fix_applied: When the loop breaker warning fired, the agent halted the repeated
    command execution, re-read the actual test output and the test source, and re-evaluated
    the test logic (e.g. whether the runner matched the suite convention, whether
    a fixture or path was wrong) before issuing any further command. The repeated
    identical invocation was stopped and replaced with a single, differently-scoped
    verification step.
  prevention: Treat a loop breaker warning as a hard stop, not a hint — immediately
    halt any command you are about to repeat verbatim. Before re-running a test or
    command, change at least one input — the runner, the target path, the arguments,
    or your hypothesis about why it failed — or re-read the prior output and the relevant
    source to form a new hypothesis. If the same command has already produced the
    same result twice, do not run it a third time; instead inspect the test file and
    the failure message, adjust the approach, and only then re-verify. A repetition
    that cannot change the outcome is a defect in the plan, not in the command.
- id: ERR-2026-09-06-002
  date: '2026-09-06'
  category: error-diagnosis
  title: Non-zero exit code re-executed without inspecting stderr or traceback
  description: A subagent ran a script or test command that exited with a non-zero
    return code, then immediately re-ran the identical command expecting a different
    result. The agent never read the stderr output or the Python traceback that the
    first invocation had already produced, so the same failure repeated and burned
    tool iterations without any new information.
  root_cause: The agent treated a non-zero exit code as a transient signal worth retrying
    rather than as a pointer to a specific failure. The exact stderr text and traceback
    were already available in the first invocation's output, but the agent skipped
    reading them and re-executed the unchanged command. Re-running a deterministic
    command with no change to its inputs cannot produce a different exit code, so
    the repetition was pure waste and the underlying defect was never diagnosed.
  impact: Tool iterations were wasted on no-op retries, the cycle risked exhausting
    its iteration budget without progress, and the real cause of the failure (a missing
    dependency, a wrong path, a syntax error, a bad argument) was never identified
    because the diagnostic output was never read.
  fix_applied: On the first non-zero exit, the agent stopped re-executing and instead
    read the full stderr and traceback from the prior invocation's output. It identified
    the specific exception and line number, formed a concrete hypothesis about the
    cause, and only then issued a changed command (fixed path, corrected argument,
    or a targeted single-test run) to verify the fix.
  prevention: On any non-zero exit code, immediately inspect the exact stderr and
    traceback output from that invocation before running anything else. Do not re-execute
    an identical failing command — a deterministic command with unchanged inputs will
    return the same non-zero code. Read the exception type, message, and the failing
    line, form a hypothesis about the root cause, and change at least one input (path,
    argument, environment, or the code itself) before re-verifying. If the output
    was truncated, re-run with a bounded output capture (e.g. redirect stderr to a
    file and read the tail) rather than blindly repeating the command.
- id: ERR-2026-09-06-003
  date: '2026-09-06'
  category: performance-defaults
  title: Adding --fast flags did not resolve caller harness timeouts because caller
    defaults stayed slow
  description: In cycle-3a596d50297a a script was given an opt-in --fast flag to speed
    up execution, but the caller harness still timed out. The flag only changed the
    script's own behavior when explicitly passed; the callers, wrapper scripts, and
    default configuration all continued to invoke the slow path, so end-to-end runtime
    was unchanged and the harness timeout persisted.
  root_cause: The optimization was added as an opt-in flag rather than as the default.
    The slow path remained the default, and no caller was updated to pass the flag,
    so the default configuration that the harness actually exercised stayed slow.
    A flag that no caller sets has no effect on the runtime the harness measures.
  impact: The harness timeout was not resolved, the cycle failed to meet its deadline,
    and the added flag became dead code that gave a false impression that the performance
    problem had been addressed.
  fix_applied: Made the fast execution path the default behavior of the script and
    audited every caller, wrapper, and default configuration to confirm the fast path
    is the one actually exercised end-to-end. The slow path was retained only as an
    explicit opt-out flag for cases that genuinely need it.
  prevention: When adding a fast/optimized execution path, make it the default rather
    than an opt-in flag, and verify the caller defaults (grep every caller, wrapper
    script, and default configuration) to confirm the fast path is the one actually
    invoked end-to-end. A performance fix that no caller exercises does not change
    the runtime the harness measures, so measure the full call chain (not just the
    script in isolation) before declaring the timeout resolved.
