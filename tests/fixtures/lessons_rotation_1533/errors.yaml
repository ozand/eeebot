    to work (no crash) but produced no output.

    '
  fix_applied: "Created a manual symlink:\nsudo ln -s /home/opencode/servers_team/repo_research/eeebot-self-evolving/lessons\
    \ \\\n  /opt/eeepc-agent/runtimes/self-evolving-agent/current/lessons\n"
  prevention: "1. deploy_release.sh must create lessons/ symlink pointing to eeebot-self-evolving/lessons/\n\
