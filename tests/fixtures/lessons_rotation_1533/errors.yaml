  date: '2026-06-15'
  category: deployment
  title: Runtime lessons/ directory missing — symlink not created after deploy
  description: 'After deploying new coordinator with lessons integration, LessonsDB
    silently wrote nothing.

    The workspace path resolved to /opt/eeepc-agent/runtimes/self-evolving-agent/current

    (WorkingDirectory from systemd), but lessons/ subdirectory did not exist there.

