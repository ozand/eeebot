  - cycle-bdea8c5fbdc2
  date: '2026-09-04'
  cycle_id: cycle-260bd269e5a0
  task_id: Record lesson in lessons.yaml on using sys.stdlib_module_names for standard
    library detection
  hypothesis: Codifying the sys.stdlib_module_names lookup in lessons.yaml lets future
    cycles detect standard library modules with a constant-time set membership check
    instead of dynamic import inspection, avoiding turn-budget exhaustion.
  result: 'Reflected: lesson recorded from cycle-bdea8c5fbdc2 turn exhaustion analysis.'
  generalized_insight: Prefer constant-time membership checks against sys.stdlib_module_names
    over dynamic import or sys.path inspection when classifying modules as standard
    library vs third-party; reserve importlib.util.find_spec for cases that also require
    importability confirmation.
- schema_version: 2
  id: LESS-20260904-d44ed220
  title: Stop repeated codebase searches when grep returns empty for newly requested
    feature terms; proceed directly to inspecting and editing the target script
  problem: When a task requests a new feature or term that does not yet exist in the
    codebase, subagents repeatedly re-run grep and list_dir sweeps searching for the
    term, burning tool iterations on searches that will always return empty. The term
    is new by definition, so no existing match is possible, and each redundant search
    wastes a full iteration of the cycle budget.
  solution: When a task names a new feature, term, or symbol that is not yet present
    in the codebase, run at most one targeted grep to confirm absence, then stop searching
    and proceed directly to reading the designated target file and making the edit.
    Do not re-run the same or similar searches expecting a different result. If the
    first grep returns empty, treat that as confirmation the feature is new and move
    to the edit phase immediately.
  tags:
  - search
  - grep
  - efficiency
  - turn-budget
  - new-features
  severity: medium
  seen_count: 1
