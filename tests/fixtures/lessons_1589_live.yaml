  date: '2026-09-04'
  cycle_id: cycle-90931e43a3db
  task_id: Record lesson on supporting dual relative path formats in markdown catalog
    index consistency tests
  hypothesis: Codifying the dual-base link resolution rule in lessons.yaml lets future
    catalog index consistency tests accept both repository-relative and directory-relative
    markdown links without false-positive missing-file failures.
  result: 'Reflected: lesson recorded from cycle-90931e43a3db reflection on dual relative
    path formats.'
  generalized_insight: Markdown catalog index consistency tests should resolve each
    relative link against both the index file's directory and the repository root,
    and only flag a link as missing when neither candidate path exists, so both 'memory/facts/...'
    and 'facts/...' link formats validate cleanly.
