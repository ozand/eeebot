  id: LESS-20260904-260bd269
  title: Use sys.stdlib_module_names (Python 3.10+) for O(1) standard library module
    detection instead of dynamic import inspection
  problem: detecting whether a module is part of the standard
    library required dynamic inspection (importing modules or walking sys.path), which
    burned tool iterations and exhausted the cycle's turn budget before the change
    was committed.
  solution: 'Check membership against sys.stdlib_module_names, a frozenset of all
    standard library module names available since Python 3.10: `import sys; is_stdlib
    = name in sys.stdlib_module_names`. For submodules (e.g. ''json.decoder''), check
    the top-level package name. Combine with importlib.util.find_spec only when you
    also need to confirm the module is importable in the current environment. This
    is a constant-time set lookup with no import side effects and no filesystem traversal.'
  tags:
  - python
  - stdlib
  - performance
  - detection
  severity: medium
  seen_count: 1
  first_seen: '2026-09-04'
  last_seen: '2026-09-04'
