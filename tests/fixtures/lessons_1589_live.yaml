  date: '2026-09-05'
  cycle_id: cycle-c2ab8feea257
  task_id: Add lesson card for composite tool execution and chained discovery in lessons/lessons.yaml
  hypothesis: Codifying the composite-tool-execution rule in lessons.yaml lets subagents
    collapse multiple independent discovery round-trips into chained shell queries
    and parallel tool calls, preserving the bounded turn budget for editing and verification.
  result: 'Reflected: lesson recorded from cycle-c2ab8feea257 on chaining shell queries
    and issuing parallel calls during context discovery.'
  generalized_insight: During context discovery, chain related shell queries into
    a single exec call and issue independent read_file/list_dir calls in parallel
