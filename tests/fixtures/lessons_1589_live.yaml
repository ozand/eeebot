  evidence:
  - cycle-d44ed220091b
  date: '2026-09-04'
  cycle_id: cycle-d44ed220091b
  task_id: Record lesson in lessons.yaml on avoiding repetitive searches for new feature
    terms
  hypothesis: Codifying the bounded-search guideline in lessons.yaml lets subagents
    skip redundant grep sweeps for new feature terms and proceed directly to target
    inspection and editing, preserving turn budget for actual implementation work.
  result: 'Reflected: lesson recorded from cycle analysis of repetitive search patterns.'
  generalized_insight: When a task introduces a new feature term or symbol, at most
    one targeted grep confirms absence; further identical or similar searches are
    wasted iterations. After confirming the term is new, proceed directly to reading
    the designated target file and making the edit rather than re-searching the codebase.
- schema_version: 2
  id: LESS-20260904-90931e43
  title: Support both repository-relative ('memory/facts/...') and directory-relative
    ('facts/...') markdown link formats in catalog index consistency tests
  problem: a markdown catalog index consistency test resolved
    every relative link in the index against a single base (the memory/ directory),
    so links written in the other common format — repository-relative ('memory/facts/...')
    instead of directory-relative ('facts/...') — were reported as missing files even
    though the target exists on disk. The test failed on a valid index purely because
    of the link's path format.
  solution: When validating relative markdown links in a catalog index (e.g. memory/index.md),
    resolve each link against both candidate bases — the index file's own directory
    and the repository root — and treat the link as valid if either resolution yields
    an existing file. Only report a link as missing when neither candidate path exists.
    This makes the consistency check format-agnostic for the two relative path conventions
    used in the catalog.
  tags:
  - markdown
  - catalog
  - index
  - link-integrity
  - relative-paths
  - testing
  severity: medium
  seen_count: 1
