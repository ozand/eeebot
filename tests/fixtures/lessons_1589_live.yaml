- schema_version: 2
  id: LESS-REF-16004180ba43-4e57
  title: Use git stash -u for untracked files
  problem: 'In turns 6 and 8, `git stash` failed with ''No stash entries found'' and
    ''error: pathspec ... did not match any file(s) known to git'' because the file
    had not yet been tracked by git.'
  solution: Use `git stash push -u <file>` or `--include-untracked` when stashing
    newly created untracked files to avoid pathspec mismatch errors.
  tags:
  - reflector
  severity: medium
  seen_count: 2
